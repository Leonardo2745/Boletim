<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DOCUMENT</title>

<body>
<header>
  <nav class="navigation-bar">
    <a href="https://leonardo2745.github.io/"><button>Voltar para o site</button></a><br>
    
  </nav>
</header>
  <div class="container text-center d-block">

    <div class="row">
      <div class="card esti">
        <h4><b>Boletim</b></h4>
        <div id="userDiv" class="card" style="width: auto;height: 100%; align-items: center; ">
          <div class="text-center mb-3" style="width: 30rem; height: 16em">
            <div class="card-body">
              <label for="nomeUsuario">Aluno:</label>
              <input type="text" id="nomeUsuario" />
              <div class="mx-auto p-2" style="width: 300px"></div>
              
                <label for="nomeInstituicao">Escola:</label>
                <input type="text" id="nomeInstituicao" />
                <div class="mx-auto p-2" style="width: 300px"></div>
             
              <label for="nomeCurso">Curso:</label>
              
                <input type="text" id="nomeCurso" />
                <div class="mx-auto p-2" style="width: 300px"></div>
              
              <div>
                <button onclick="saveUser()">Salvar</button>
              </div>
            </div>
          </div>
        </div>

        <div id="content2">
          <!-- <div class="row-cols-8 col-2 p-md-4 input-group" style="align-items:center; text-align: center;width: 100%;"> -->
          <div id="materiasDiv" class="materia col-md-6">
            <div class="card" style="width: 100%; height: 27rem;">
              <div class="matItems">
              <label for="nomMateria">Selecione a matéria: </label>
              <select style="text-align: center;" id="nomMateria"></select>
              <div class="input-group">
              <ul class="list-group-flush">
                <label><b>Insira as notas abaixo:</b></label>
                <div class="mx-auto p-2" style="width: 200px"></div>
                <label for="bim1">1° Bim:</label>
                <input type="number" id="bim1" />
                <div class="mx-auto p-2" style="width: 200px"></div>
                <label for="bim2">2° Bim:</label>
                <input type="number" id="bim2" />
                <div class="mx-auto p-2" style="width: 200px"></div>
                <label for="bim3">3° Bim:</label>
                <input type="number" id="bim3" />
                <div class="mx-auto p-2" style="width: 200px"></div>
                <label for="bim4">4° Bim:</label>
                <input type="number" id="bim4" />
              </div>
              </ul>
              <div >
                <button onclick="save()">Verificar Notas</button>
                <button onclick="refresh()">Inserir outro aluno</button>
              </div>
              </div>

            </div>
          </div>
          <div class="align">
            <div class="card" style="width: 34rem; margin-bottom: 12px;" id="resultNotas"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"

  <script src="./script-boletim.js"></script>

</html>
